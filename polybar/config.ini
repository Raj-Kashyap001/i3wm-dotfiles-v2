[colors]
background = #e41a1b26
background-alt = #24283b
foreground = #c0caf5
primary = #7aa2f7
secondary = #bb9af7
tertiary = #f9e2af
alert = #f7768e
disabled = #414868

[bar/main]
width = 100%
height = 30pt
radius = 0
bottom = true

background = ${colors.background}
foreground = ${colors.foreground}

line-size = 3pt
padding-left = 2
padding-right = 2
module-margin = 1

font-0 = "Comic Relief:size=12;3"
font-1 = "JetBrainsMono Nerd Font:size=14;4"

; Layout: Title in center, System tray on the right
modules-left = launcher separator xworkspaces layout xwindow
modules-center = media 
modules-right = left-bracket tray right-bracket netspeed-wifi netspeed-eth pulseaudio memory cpu date


cursor-click = pointer
enable-ipc = true
wm-restack = i3

[module/media]
type = custom/script
exec = python3 ~/.config/polybar/scripts/media.py
tail = true
label = %output%

[module/xworkspaces]
type = internal/xworkspaces
label-active = 󰮯
label-active-foreground = ${colors.tertiary}
label-active-padding = 2

label-occupied = 󰊠
label-occupied-foreground = ${colors.foreground}
label-occupied-padding = 2

label-urgent = 󰀦
label-urgent-background = ${colors.alert}
label-urgent-padding = 2

label-empty = 󰑊
label-empty-foreground = ${colors.disabled}
label-empty-padding = 2

[module/xwindow]
type = internal/xwindow
label = %title:0:38:...%
label-foreground = ${colors.secondary}

[module/layout]
type = custom/script
exec = python3 ~/.config/polybar/scripts/i3wm.py
tail = true
label = %output%
label-padding = 1

[module/launcher]
type = custom/text
content = 󰣇
content-font = 1
content-padding = 2
content-foreground = ${colors.primary}
click-left = rofi -show drun

[module/separator]
type = custom/text
content = |
content-foreground = ${colors.disabled}
content-padding = 1




[module/tray]
type = internal/tray
tray-spacing = 10px
tray-size = 55%

[module/pulseaudio]
type = internal/pulseaudio
format-volume-prefix = "vol: "
format-volume-prefix-foreground = ${colors.primary}
format-volume = <label-volume>
label-volume = %percentage%%
format-muted-prefix = "mute: "
format-muted-prefix-foreground = ${colors.alert}
format-muted = <label-muted>
label-muted = %percentage%%
click-right = pavucontrol

[module/memory]
type = internal/memory
interval = 2
format-prefix = "mem: "
format-prefix-foreground = ${colors.primary}
label = %percentage_used:2%%
click-left = btop

[module/cpu]
type = internal/cpu
interval = 2
format-prefix = "cpu: "
format-prefix-foreground = ${colors.primary}
label = %percentage:2%%
click-left = btop

[module/date]
type = internal/date
interval = 1
format-prefix = "it's "
format-prefix-foreground = ${colors.primary}
; Fixed date formats
date = %I:%M %p
date-alt = %B %d, %Y %I:%M %p
label = %date%

[module/left-bracket]
type = custom/text
content = [
content-foreground = ${colors.primary}

[module/right-bracket]
type = custom/text
content = ]
content-foreground = ${colors.primary}

[module/netspeed]
type = internal/network

; Let polybar auto-detect the active interface
interface-type = wireless
; If you want wired instead, change to:
; interface-type = wired

interval = 2
accumulate-stats = true
unknown-as-up = true
speed-unit = B/s

format-connected = <label-connected>
format-disconnected = <label-disconnected>

label-connected = net: %netspeed:9%
label-connected-foreground = ${colors.primary}

label-disconnected = net: --
label-disconnected-foreground = ${colors.disabled}

[module/netspeed-wifi]
type = internal/network
interface-type = wireless
interval = 2
accumulate-stats = true
speed-unit = B/s

format-connected = <label-connected>
format-disconnected = <label-disconnected>

label-connected = wifi:%netspeed:9%
label-disconnected =
label-disconnected-foreground = ${colors.disabled}

[module/netspeed-eth]
type = internal/network
interface-type = wired
interval = 2
accumulate-stats = true
speed-unit = B/s

format-connected = <label-connected>
format-disconnected = <label-disconnected>

label-connected = eth: %netspeed:9%
label-disconnected = 
label-disconnected-foreground = ${colors.disabled}
